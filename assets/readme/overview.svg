<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title description">
  <title id="title">Raspberry Pi Voting Prototype: identity checks and physical interaction</title>
  <desc id="description">An academic hardware prototype connects fingerprint and camera-based identity checks, candidate buttons and LCD confirmation. The display and button shapes are an illustrative interface motif.</desc>
  <rect width="1200" height="470" rx="20" fill="#11151c"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="64" y="57" font-size="25" letter-spacing="2.6" fill="#b8c3d2">EMBEDDED SYSTEMS / PYTHON</text>
    <text x="60" y="153" font-size="84" font-weight="750" fill="#f6f8fc">Raspberry Pi</text>
    <text x="60" y="244" font-size="76" font-weight="750" fill="#bd9bff">Voting Prototype</text>
    <text x="64" y="321" font-size="32" fill="#cbd5e1">Identity checks, physical inputs and display feedback.</text>
    <g id="display-and-input-motif">
      <rect x="920" y="108" width="216" height="103" rx="9" fill="#202a37" stroke="#bd9bff" stroke-width="2"/>
      <text x="1028" y="176" font-size="44" font-weight="600" text-anchor="middle" fill="#f6f8fc">LCD</text>
      <g fill="#bd9bff">
        <circle cx="940" cy="243" r="12"/><circle cx="983" cy="243" r="12"/>
        <circle cx="1026" cy="243" r="12"/><circle cx="1069" cy="243" r="12"/>
        <circle cx="1112" cy="243" r="12"/>
      </g>
    </g>
    <text x="64" y="419" font-size="30" font-weight="600" fill="#f6f8fc">Verify identity</text>
    <text x="470" y="419" font-size="30" font-weight="600" fill="#f6f8fc">Select candidate</text>
    <text x="908" y="419" font-size="30" font-weight="600" fill="#f6f8fc">Confirm</text>
  </g>
</svg>
